
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio - Claude AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#fff;color:#242424;height:100vh;overflow:hidden}
.app{display:flex;height:100vh;width:100%}
.sidebar{width:260px;background:#faf9f6;border-right:1px solid #eae8e4;padding:22px 16px;display:flex;flex-direction:column;flex-shrink:0}
.logo{font-size:23px;font-weight:700;letter-spacing:-1px;margin:5px 8px 30px}
.logo span{color:#c66a43}
.new-chat{width:100%;padding:13px;border:1px solid #e4e0da;border-radius:10px;background:white;text-align:left;font-size:14px;cursor:pointer;margin-bottom:30px}
.section-title{font-size:12px;color:#88837c;margin:0 8px 12px}
.ai-option{display:flex;align-items:center;gap:11px;padding:12px;border-radius:10px;background:#f0ebe5;border:1px solid #e7ddd3}
.ai-icon{background:#d97757;color:white;width:35px;height:35px;border-radius:10px;display:grid;place-items:center;font-weight:bold;font-size:19px}
.ai-name{font-size:14px;font-weight:600}
.ai-status{font-size:12px;color:#777;margin-top:5px}
.status-dot{display:inline-block;width:7px;height:7px;background:#38a169;border-radius:50%;margin-right:4px}
.sidebar-bottom{margin-top:auto;border-top:1px solid #e7e3dc;padding:17px 5px 0;font-size:13px;color:#777}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.topbar{height:65px;border-bottom:1px solid #f0efed;display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600}
.topbar-subtitle{color:#888;font-size:12px;margin-top:4px}
.menu-btn{display:none;background:white;border:1px solid #eee;border-radius:8px;padding:8px 11px;cursor:pointer}
.chat-area{flex:1;overflow-y:auto;padding:35px 20px;scroll-behavior:smooth}
.welcome{max-width:700px;margin:10vh auto 35px;text-align:center}
.welcome-icon{height:62px;width:62px;border-radius:18px;background:#f6e6dc;color:#c66a43;display:grid;place-items:center;font-size:34px;margin:0 auto 24px}
.welcome h1{font-size:clamp(26px,4vw,38px);letter-spacing:-1.2px;font-weight:600;margin-bottom:13px}
.welcome p{color:#777;font-size:15px;line-height:1.7;max-width:480px;margin:auto}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:650px;margin:30px auto 0}
.suggestion{padding:17px;border:1px solid #eae8e4;border-radius:12px;background:#fff;text-align:left;cursor:pointer;transition:.2s}
.suggestion:hover{background:#faf8f5;border-color:#d8c6b8}
.suggestion strong{display:block;font-size:14px;margin-bottom:7px}
.suggestion span{color:#888;font-size:12px;line-height:1.5}
.messages{max-width:750px;margin:0 auto;width:100%}
.message{margin:20px 0;display:flex;flex-direction:column;align-items:flex-end}
.message.assistant{align-items:flex-start}
.message-label{font-size:12px;color:#8b8580;margin-bottom:8px}
.bubble{max-width:88%;padding:14px 17px;border-radius:15px;font-size:15px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{background:#f3f0ec;border:1px solid #eee9e3}
.assistant .bubble{padding-left:0;background:white}
.error{color:#a43c35}
.composer-area{padding:12px 20px 22px;background:white;flex-shrink:0}
.composer{max-width:750px;margin:auto;border:1px solid #dcd8d2;border-radius:17px;padding:13px 14px 10px;box-shadow:0 3px 14px #00000009}
.composer:focus-within{border-color:#c7a38e}
textarea{width:100%;min-height:55px;max-height:180px;resize:none;border:none;outline:none;font:inherit;font-size:15px;line-height:1.6;background:transparent;color:#242424}
textarea::placeholder{color:#99938c}
.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.composer-note{font-size:11px;color:#999}
.send-btn{width:39px;height:39px;border:none;border-radius:11px;background:#c66a43;color:white;font-size:21px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.send-btn:hover{background:#ac5836}
.send-btn:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:650px){
.sidebar{display:none;position:fixed;z-index:5;top:0;bottom:0;left:0;box-shadow:10px 0 30px #00000012}
.sidebar.open{display:flex}.menu-btn{display:block}
.topbar{height:60px;padding:0 14px;gap:12px}
.chat-area{padding:18px 15px}
.welcome{margin:7vh auto 25px}
.welcome h1{font-size:28px}.welcome p{font-size:14px}
.suggestions{grid-template-columns:1fr;gap:9px;margin-top:24px}
.suggestion{padding:14px}
.composer-area{padding:10px 12px 15px}
.bubble{max-width:95%}.composer-note{font-size:10px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">AI <span>Studio.</span></div>
    <button class="new-chat" onclick="newChat()">+ &nbsp; नई बातचीत</button>
    <div class="section-title">आपका AI</div>
    <div class="ai-option">
      <div class="ai-icon">✳</div>
      <div>
        <div class="ai-name">Claude AI</div>
        <div class="ai-status"><span class="status-dot"></span>AI चुना गया</div>
      </div>
    </div>
    <div class="sidebar-bottom">
      <div>AI Studio</div>
      <div style="margin-top:7px">एक जगह, आपके सारे विचार।</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div>
        <div class="topbar-title">Claude AI</div>
        <div class="topbar-subtitle">आपका AI असिस्टेंट</div>
      </div>
      <div style="font-size:12px;color:#777">AI Chat</div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✳</div>
        <h1>आज आप क्या करना चाहते हैं?</h1>
        <p>Claude AI से बात करें, अपने सवाल पूछें, नए आइडिया खोजें और अपने काम में मदद पाएँ।</p>
        <div class="suggestions">
          <button class="suggestion" onclick="useSuggestion('मेरे लिए एक शानदार वेबसाइट का कोड लिखो')">
            <strong>⌘ &nbsp; वेबसाइट बनाना</strong><span>अपनी वेबसाइट के लिए कोड और आइडिया पाएँ।</span>
          </button>
          <button class="suggestion" onclick="useSuggestion('मुझे एक नया और क्रिएटिव बिजनेस आइडिया बताओ')">
            <strong>✧ &nbsp; नए आइडिया</strong><span>अपने विचारों को आगे बढ़ाने में मदद लें।</span>
          </button>
          <button class="suggestion" onclick="useSuggestion('मुझे JavaScript प्रोग्रामिंग आसान भाषा में सिखाओ')">
            <strong>⌘ &nbsp; कोडिंग सीखना</strong><span>प्रोग्रामिंग और तकनीकी सवाल पूछें।</span>
          </button>
          <button class="suggestion" onclick="useSuggestion('मुझे एक अच्छी कहानी लिखकर दो')">
            <strong>✎ &nbsp; लिखने में मदद</strong><span>कहानी, आर्टिकल और दूसरे टेक्स्ट लिखवाएँ।</span>
          </button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <footer class="composer-area">
      <form class="composer" id="chatForm">
        <textarea id="prompt" placeholder="Claude से कुछ भी पूछें..." aria-label="अपना मैसेज लिखें" rows="2"></textarea>
        <div class="composer-bottom">
          <div class="composer-note">Claude AI · सुरक्षित सर्वर कनेक्शन</div>
          <button class="send-btn" id="sendBtn" type="submit" aria-label="मैसेज भेजें">↑</button>
        </div>
      </form>
    </footer>
  </main>
</div>

<script>
const form = document.getElementById("chatForm");
const promptBox = document.getElementById("prompt");
const messages = document.getElementById("messages");
const chatArea = document.getElementById("chatArea");
const welcome = document.getElementById("welcome");
const sendBtn = document.getElementById("sendBtn");

// Backend server का endpoint.
// Backend को POST /api/chat पर JSON { messages: [...] }
// स्वीकार करके JSON { reply: "..." } लौटाना होगा।
const API_URL = "/api/chat";

let busy = false;
let conversationHistory = [];

function useSuggestion(text) {
  promptBox.value = text;
  promptBox.focus();
  promptBox.dispatchEvent(new Event("input"));
}

function newChat() {
  if (busy) return;
  messages.replaceChildren();
  welcome.style.display = "";
  promptBox.value = "";
  conversationHistory = [];
  document.getElementById("sidebar").classList.remove("open");
  promptBox.focus();
}

function addMessage(role, text) {
  const wrapper = document.createElement("div");
  wrapper.className = "message " + role;

  const label = document.createElement("div");
  label.className = "message-label";
  label.textContent = role === "user" ? "आप" : "Claude";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  wrapper.append(label, bubble);
  messages.appendChild(wrapper);
  chatArea.scrollTop = chatArea.scrollHeight;

  return bubble;
}

promptBox.addEventListener("input", () => {
  promptBox.style.height = "auto";
  promptBox.style.height = Math.min(promptBox.scrollHeight, 180) + "px";
});

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  const question = promptBox.value.trim();
  if (!question || busy) return;

  welcome.style.display = "none";
  addMessage("user", question);

  promptBox.value = "";
  promptBox.style.height = "auto";
  busy = true;
  sendBtn.disabled = true;

  const answerBubble = addMessage("assistant", "Claude जवाब तैयार कर रहा है...");
  const pendingHistory = [
    ...conversationHistory,
    { role: "user", content: question }
  ];

  try {
    // यूज़र का सवाल वेबसाइट के सर्वर पर भेजें।
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: pendingHistory })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "सर्वर से जवाब नहीं मिला।");
    }

    if (typeof data.reply !== "string") {
      throw new Error("सर्वर से जवाब का फ़ॉर्मेट सही नहीं है।");
    }

    // सर्वर Claude का जवाब वापस वेबसाइट को भेजता है।
    answerBubble.textContent = data.reply;

    conversationHistory = [
      ...pendingHistory,
      { role: "assistant", content: data.reply }
    ];

  } catch (error) {
    answerBubble.textContent =
      "कनेक्शन में समस्या हुई: " + error.message +
      " कृपया जाँचें कि backend server चालू है।";
    answerBubble.classList.add("error");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    promptBox.focus();
    chatArea.scrollTop = chatArea.scrollHeight;
  }
});
</script>
</body>
</html>
