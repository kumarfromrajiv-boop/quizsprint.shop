<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude AI Chat - quizsprint.shop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: 100%;
      max-width: 900px;
      height: 95vh;
      background: white;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 30px rgba(0,0,0,0.12);
    }
    .header {
      padding: 18px 22px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 22px;
      font-weight: bold;
    }
    .status {
      font-size: 13px;
      color: #666;
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .message {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: #e8e8e8;
    }
    .assistant {
      align-self: flex-start;
      background: #f6f6f6;
      border: 1px solid #e2e2e2;
    }
    .input-area {
      border-top: 1px solid #ddd;
      padding: 15px;
      display: flex;
      gap: 10px;
      background: white;
    }
    .input-area textarea {
      flex: 1;
      resize: none;
      height: 52px;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      outline: none;
    }
    .input-area textarea:focus {
      border-color: #888;
    }
    .send-button {
      width: 90px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    .send-button:hover {
      background: #000;
    }
    .send-button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    @media (max-width: 600px) {
      .app {
        height: 100vh;
        border-radius: 0;
      }
      .message {
        max-width: 90%;
      }
      .input-area {
        padding: 10px;
      }
      .send-button {
        width: 70px;
      }
    }
  </style>
</head>
<body>

  <div class="app" id="app">
    <div class="header">
      <div class="logo">Claude AI</div>
      <div class="status">Online</div>
    </div>

    <div class="chat" id="chat">
      <div class="message assistant">
        नमस्ते! मैं Claude हूँ। आप मुझसे कुछ भी पूछ सकते हैं।
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="messageInput"
        placeholder="Message Claude..."
        onkeydown="handleKey(event)"
      ></textarea>
      <button
        class="send-button"
        id="sendButton"
        onclick="sendMessage()"
      >
        Send
      </button>
    </div>
  </div>

  <script>
    let conversation = [];
    
    // आपकी API Key यहाँ सेट कर दी गई है
    const userApiKey = "sk-live-2be9f9b6cbb12e23a94604879722923e39617d562f7b9fa7a7b2b6a3f48972ce";

    function handleKey(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function addMessage(text, type) {
      const chat = document.getElementById("chat");
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const button = document.getElementById("sendButton");
      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      button.disabled = true;
      button.textContent = "...";

      conversation.push({
        role: "user",
        content: message
      });

      try {
        const response = await fetch("https://aicredits.in/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + userApiKey
          },
          body: JSON.stringify({
            model: "anthropic/claude-haiku-5.5",
            messages: conversation
          })
        });

        if (!response.ok) {
          throw new Error("Server error: " + response.status);
        }

        const data = await response.json();
        const reply = data.choices && data.choices[0].message.content 
                      ? data.choices[0].message.content 
                      : "कोई response नहीं मिला।";

        addMessage(reply, "assistant");

        conversation.push({
          role: "assistant",
          content: reply
        });

      } catch (error) {
        console.error(error);
        addMessage(
          "Claude से connection नहीं हो पाया। कृपया इंटरनेट कनेक्शन या वॉलेट बैलेंस जाँच करें।",
          "assistant"
        );
      }

      button.disabled = false;
      button.textContent = "Send";
    }
  </script>
</body>
</html>
