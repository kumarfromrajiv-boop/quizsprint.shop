<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathSprint - Math Practice</title>

  <style>
    :root {
      --cream: #fffaf0;
      --paper: #fffdf7;
      --green: #204d46;
      --green-light: #2b7a67;
      --orange: #e2784e;
      --yellow: #e8b53d;
      --muted: #777463;
      --border: #e9dfc8;
      --shadow: 0 20px 45px rgba(68, 56, 27, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--green);
      background:
        radial-gradient(circle at 80% 0%, rgba(255, 231, 179, 0.35), transparent 35%),
        linear-gradient(135deg, #fffaf0 0%, #fffdf7 55%, #fff2e9 100%);
      font-family: Inter, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
    }

    .header {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-button {
      border: 0;
      background: transparent;
      padding: 0;
      color: inherit;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--green-light);
      color: #fff9e9;
      box-shadow: 4px 4px 0 #d8bd68;
      font-size: 23px;
      font-weight: 900;
    }

    .brand-name {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
    }

    .brand-subtitle {
      margin: 5px 0 0;
      color: #8c8270;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header-message {
      padding: 10px 16px;
      border: 1px solid #e5d9ba;
      border-radius: 999px;
      color: #766e5e;
      background: rgba(255, 249, 233, 0.8);
      font-size: 12px;
      font-weight: 800;
    }

    .home-layout {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 45px 32px 70px;
      display: grid;
      grid-template-columns: 1.04fr 0.96fr;
      gap: 48px;
      align-items: start;
    }

    .intro {
      padding-top: 50px;
    }

    .greeting {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #c17336;
      font-size: 14px;
      font-weight: 800;
    }

    .greeting-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eaa344;
    }

    .hero-title {
      max-width: 600px;
      margin: 26px 0 0;
      font-size: clamp(52px, 8vw, 106px);
      line-height: 0.9;
      letter-spacing: -7px;
      font-weight: 950;
    }

    .hero-title .highlight {
      position: relative;
      color: var(--orange);
    }

    .highlight::after {
      content: "";
      position: absolute;
      left: 0;
      right: -5px;
      bottom: -13px;
      height: 6px;
      border-radius: 10px;
      background: var(--yellow);
      transform: rotate(-2deg);
    }

    .hero-description {
      max-width: 450px;
      margin: 34px 0 0;
      color: #706f63;
      font-size: 17px;
      line-height: 1.65;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      margin-top: 40px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #68695d;
      font-size: 14px;
      font-weight: 700;
    }

    .stat-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #c4872b;
      background: #fff0c7;
      font-weight: 900;
    }

    .stat:nth-child(2) .stat-icon {
      color: var(--green-light);
      background: #e3f4ec;
    }

    .stat strong {
      color: var(--green);
    }

    .math-decoration {
      position: relative;
      height: 100px;
      max-width: 400px;
      margin-top: 62px;
    }

    .shape {
      position: absolute;
      display: grid;
      place-items: center;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(68, 56, 27, 0.1);
    }

    .shape-plus {
      left: 16px;
      top: 10px;
      width: 66px;
      height: 66px;
      border: 2px solid #e9ce6b;
      border-radius: 17px;
      color: #a97c16;
      background: #fff4bc;
      transform: rotate(-8deg);
      font-size: 30px;
    }

    .shape-equals {
      left: 116px;
      top: 36px;
      color: #c67a50;
      font-size: 25px;
      box-shadow: none;
    }

    .shape-win {
      left: 190px;
      top: 0;
      width: 80px;
      height: 80px;
      border: 2px solid #abd8c1;
      border-radius: 24px;
      color: var(--green-light);
      background: #e0f5e8;
      transform: rotate(8deg);
      font-size: 23px;
    }

    .topic-panel {
      position: relative;
      overflow: hidden;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 32px;
      background: var(--cream);
      box-shadow: var(--shadow);
    }

    .dot-grid {
      position: absolute;
      inset: 0;
      opacity: 0.55;
      pointer-events: none;
      background-image: radial-gradient(#e5d9bd 1px, transparent 1px);
      background-size: 17px 17px;
    }

    .topic-panel-content {
      position: relative;
    }

    .panel-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0;
      color: #a29a89;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .panel-title {
      margin: 5px 0 0;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -1.5px;
      font-weight: 900;
    }

    .question-count {
      flex-shrink: 0;
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--green-light);
      background: #e7f4ed;
      font-size: 12px;
      font-weight: 900;
    }

    .topics {
      display: grid;
      gap: 12px;
    }

    .topic-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 18px;
      text-align: left;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .topic-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 17px rgba(68, 56, 27, 0.1);
    }

    .topic-button:focus-visible,
    .main-button:focus-visible,
    .secondary-button:focus-visible,
    .back-button:focus-visible,
    .brand-button:focus-visible,
    .clear-button:focus-visible {
      outline: 3px solid #8cc5b0;
      outline-offset: 3px;
    }

    .topic-addition {
      border-color: #f5d1a6;
      background: #fff0df;
    }

    .topic-subtraction {
      border-color: #bed9e9;
      background: #eaf5fc;
    }

    .topic-multiplication {
      border-color: #ecdaa0;
      background: #fff8d9;
    }

    .topic-division {
      border-color: #dec5ea;
      background: #f7eefd;
    }

    .topic-bodmas {
      border-color: #bce5d3;
      background: #e2f7ee;
    }

    .operator {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 13px;
      font-size: 23px;
      font-weight: 900;
    }

    .operator-addition {
      color: #68351f;
      background: #f4a261;
    }

    .operator-subtraction {
      color: #173e5a;
      background: #8ab7d9;
    }

    .operator-multiplication {
      color: #624d0b;
      background: #f1c84b;
    }

    .operator-division {
      color: #4d2c5c;
      background: #c29ad7;
    }

    .operator-bodmas {
      color: #124f3d;
      background: #77c8a7;
    }

    .topic-copy {
      flex: 1;
      min-width: 0;
    }

    .topic-name {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .topic-name strong {
      color: #30453f;
      font-size: 18px;
    }

    .topic-name span {
      color: #8b8375;
      font-size: 14px;
      font-weight: 700;
    }

    .topic-description {
      display: block;
      margin-top: 3px;
      color: #7b7d71;
      font-size: 12px;
      font-weight: 600;
    }

    .arrow {
      color: #9d9a89;
      font-size: 23px;
      transition: transform 0.2s ease;
    }

    .topic-button:hover .arrow {
      transform: translateX(4px);
    }

    .panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
      padding-top: 19px;
      border-top: 1px solid #ecdfc5;
      color: #8a8376;
      font-size: 12px;
    }

    .clear-button {
      border: 0;
      padding: 4px;
      color: var(--green-light);
      background: transparent;
      font-size: 12px;
      font-weight: 900;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .practice-page,
    .results-page {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 22px 24px 60px;
    }

    .practice-page {
      max-width: 780px;
    }

    .practice-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 10px 0 32px;
    }

    .back-button {
      border: 0;
      padding: 9px 4px;
      color: #777463;
      background: transparent;
      font-size: 14px;
      font-weight: 800;
    }

    .back-button:hover {
      color: var(--green);
    }

    .practice-topic {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #726e61;
      background: #fff9e9;
      font-size: 12px;
      font-weight: 900;
    }

    .practice-topic .mini-operator {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 900;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
    }

    .progress-row span:last-child {
      color: #c27741;
    }

    .progress-track {
      height: 12px;
      overflow: hidden;
      border-radius: 99px;
      background: #e9e3d4;
    }

    .progress-value {
      height: 100%;
      border-radius: inherit;
      background: var(--yellow);
      transition: width 0.35s ease;
    }

    .question-card,
    .result-card {
      position: relative;
      overflow: hidden;
      margin-top: 25px;
      padding: 48px;
      border: 1px solid var(--border);
      border-radius: 32px;
      background: var(--cream);
      box-shadow: var(--shadow);
    }

    .question-card::before,
    .result-card::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 145px;
      height: 145px;
      border-radius: 50%;
      background: rgba(249, 231, 169, 0.5);
    }

    .question-card::after,
    .result-card::after {
      content: "";
      position: absolute;
      left: -55px;
      bottom: -70px;
      width: 190px;
      height: 190px;
      border: 22px solid rgba(228, 242, 232, 0.6);
      border-radius: 50%;
    }

    .question-content,
    .result-content {
      position: relative;
      z-index: 1;
    }

    .question-label {
      margin: 0 0 22px;
      color: #a39a86;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
    }

    .question-expression {
      margin: 0;
      color: var(--green);
      font-size: clamp(56px, 12vw, 125px);
      line-height: 1;
      letter-spacing: -6px;
      font-weight: 950;
      text-align: center;
    }

    .answer-form {
      max-width: 420px;
      margin: 45px auto 0;
    }

    .answer-label {
      display: block;
      margin-bottom: 8px;
      color: #777463;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .answer-input {
      width: 100%;
      height: 74px;
      border: 2px solid #dbd2bd;
      border-radius: 17px;
      color: var(--green);
      background: #fffdf7;
      font-size: 38px;
      font-weight: 900;
      text-align: center;
      box-shadow: inset 0 2px 8px rgba(75, 67, 41, 0.04);
    }

    .answer-input:focus {
      outline: none;
      border-color: #4a9b83;
      box-shadow: 0 0 0 4px rgba(74, 155, 131, 0.15);
    }

    .answer-input:disabled {
      opacity: 0.7;
    }

    .answer-input::placeholder {
      color: #c8c0ae;
    }

    .answer-help {
      margin: 12px 0 0;
      color: #a19a89;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    .main-button,
    .secondary-button {
      min-height: 55px;
      border-radius: 16px;
      font-weight: 900;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .main-button {
      width: 100%;
      margin-top: 24px;
      border: 0;
      color: #fff9e9;
      background: var(--green-light);
      box-shadow: 0 5px 0 #185746;
    }

    .main-button:hover {
      background: #236d5b;
      transform: translateY(-2px);
    }

    .main-button:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .main-button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
      transform: none;
    }

    .feedback {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 420px;
      margin: 25px auto 0;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid;
    }

    .feedback.correct {
      border-color: #b8dfc7;
      background: #e9f8ef;
    }

    .feedback.incorrect {
      border-color: #f1c7b6;
      background: #fff0e7;
    }

    .feedback-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-weight: 900;
    }

    .correct .feedback-icon {
      background: #2b9472;
    }

    .incorrect .feedback-icon {
      background: #d47757;
    }

    .feedback-title {
      margin: 2px 0 0;
      font-weight: 900;
    }

    .correct .feedback-title {
      color: #236e56;
    }

    .incorrect .feedback-title {
      color: #a34e37;
    }

    .feedback-text {
      margin: 5px 0 0;
      color: #7a7569;
      font-size: 12px;
      line-height: 1.5;
    }

    .result-card {
      margin-top: 30px;
      padding: 54px;
      text-align: center;
    }

    .result-badge {
      position: relative;
      z-index: 1;
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 26px;
      color: #624d0b;
      background: #f1c84b;
      font-size: 34px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(68, 56, 27, 0.1);
    }

    .result-eyebrow,
    .result-title,
    .result-description {
      position: relative;
      z-index: 1;
    }

    .result-eyebrow {
      margin: 0;
      color: #a39a86;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .result-title {
      max-width: 650px;
      margin: 13px auto 0;
      color: var(--green);
      font-size: clamp(40px, 7vw, 75px);
      line-height: 0.95;
      letter-spacing: -4px;
      font-weight: 950;
    }

    .result-description {
      margin: 18px 0 0;
      color: #777463;
      font-weight: 600;
    }

    .result-summary {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 45px;
      margin-top: 42px;
    }

    .score-circle {
      width: 160px;
      height: 160px;
      display: grid;
      place-items: center;
      border: 13px solid #ebe3d0;
      border-top-color: var(--green-light);
      border-right-color: var(--green-light);
      border-radius: 50%;
    }

    .score-number {
      margin: 0;
      color: var(--green);
      font-size: 48px;
      font-weight: 950;
    }

    .score-number span {
      color: #a6a090;
      font-size: 22px;
    }

    .score-label {
      margin: 3px 0 0;
      color: #928b7c;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .result-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      text-align: left;
    }

    .result-stat {
      min-width: 115px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fffdf7;
    }

    .result-stat-label {
      margin: 0;
      color: #a39a86;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .result-stat-value {
      margin: 5px 0 0;
      color: var(--green-light);
      font-size: 20px;
      font-weight: 900;
    }

    .answers-review {
      position: relative;
      z-index: 1;
      margin-top: 42px;
      padding-top: 24px;
      border-top: 1px solid #eadfc8;
      text-align: left;
    }

    .review-title {
      margin: 0 0 13px;
      color: #a39a86;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .review-item {
      padding: 10px;
      border: 1px solid;
      border-radius: 12px;
    }

    .review-item.correct {
      border-color: #bde0ca;
      background: #eaf7ef;
    }

    .review-item.incorrect {
      border-color: #f0cbbb;
      background: #fff0e7;
    }

    .review-question {
      margin: 6px 0 0;
      overflow: hidden;
      color: #3d5049;
      font-size: 13px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .review-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #766f61;
      font-size: 12px;
      font-weight: 800;
    }

    .result-actions {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 36px;
    }

    .secondary-button {
      min-width: 205px;
      padding: 0 20px;
      border: 2px solid #d9cfb8;
      color: #46675d;
      background: #fffdf7;
    }

    .secondary-button:hover {
      border-color: #78bba2;
      background: #eaf7ef;
    }

    .result-footer {
      margin: 22px 0 0;
      color: #8b8577;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 850px) {
      .header {
        padding: 20px;
      }

      .header-message {
        display: none;
      }

      .home-layout {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 20px 20px 45px;
      }

      .intro {
        padding-top: 15px;
      }

      .hero-title {
        letter-spacing: -4px;
      }

      .math-decoration {
        display: none;
      }

      .topic-panel {
        padding: 22px;
      }

      .question-card,
      .result-card {
        padding: 30px 22px;
      }

      .result-summary {
        flex-direction: column;
        gap: 26px;
      }
    }

    @media (max-width: 560px) {
      .brand-name {
        font-size: 19px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
      }

      .panel-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .topic-name strong {
        font-size: 16px;
      }

      .practice-page,
      .results-page {
        padding: 12px 16px 45px;
      }

      .practice-topbar {
        align-items: flex-start;
        flex-direction: column;
        margin-bottom: 24px;
      }

      .question-expression {
        font-size: 55px;
        letter-spacing: -3px;
      }

      .review-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .result-actions {
        flex-direction: column;
      }

      .secondary-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="app" class="app"></div>

  <script>
    const SESSION_LENGTH = 5;
    const HISTORY_KEY = "mathsprint-history";

    const topics = [
